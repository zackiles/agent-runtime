name: Release CLI

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      should_deploy: ${{ steps.version.outputs.should_deploy }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "Release triggered by tag: $TAG"
          else
            COMMIT_MSG=$(git log -1 --format=%s)
            echo "Commit: $COMMIT_MSG"

            BUMP=""
            if [[ "$COMMIT_MSG" =~ ^(feat|fix)(\(.+\))?!:[[:space:]] ]]; then
              BUMP="major"
            elif [[ "$COMMIT_MSG" =~ ^feat(\(.+\))?:[[:space:]] ]]; then
              BUMP="minor"
            elif [[ "$COMMIT_MSG" =~ ^fix(\(.+\))?:[[:space:]] ]]; then
              BUMP="patch"
            fi

            if [ -z "$BUMP" ]; then
              echo "No version bump needed for: $COMMIT_MSG"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            LATEST=$(git describe --tags --abbrev=0 --match "v[0-9]*.[0-9]*.[0-9]*" 2>/dev/null || echo "v0.0.0")
            CURRENT="${LATEST#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

            case "$BUMP" in
              major) VERSION="$((MAJOR+1)).0.0" ;;
              minor) VERSION="${MAJOR}.$((MINOR+1)).0" ;;
              patch) VERSION="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
            esac

            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
            echo "$BUMP bump: $LATEST -> v$VERSION"
          fi

          FULL_MSG=$(git log -1 --format=%B)
          if [[ "$FULL_MSG" == *"[skip deploy]"* ]]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "[skip deploy] detected — release only, no production deploy"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Git
        if: steps.version.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        if: steps.version.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Deno
        if: steps.version.outputs.should_release == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Build CLI (all platforms)
        if: steps.version.outputs.should_release == 'true'
        run: deno task build ${{ steps.version.outputs.version }} --cross

      - name: Prepare release artifacts
        if: steps.version.outputs.should_release == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p "release/${VERSION}"
          for bin in cli/dist/ar-*; do
            case "$bin" in *.tar.gz) continue ;; esac
            [ -f "$bin" ] || continue
            name=$(basename "$bin")
            cp "$bin" "release/${VERSION}/${name}"
            chmod +x "release/${VERSION}/${name}"
          done
          cp skill/SKILL.md "release/${VERSION}/SKILL.md"
          cp skill/install.sh "release/${VERSION}/install-skill.sh"
          chmod +x "release/${VERSION}/install-skill.sh"
          echo "Release artifacts:"
          ls -lh "release/${VERSION}/"

      - name: Create tag
        if: steps.version.outputs.should_release == 'true' && steps.version.outputs.create_tag == 'true'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            ## AR CLI ${{ steps.version.outputs.tag }}

            **Platforms:** Linux (x64, arm64), macOS (x64, arm64)

            ### Install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            ```

            Or install a specific version:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh -s -- ${{ steps.version.outputs.tag }}
            ```

            Set `INSTALL_DIR` to change the install location (default: `/usr/local/bin`):
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | INSTALL_DIR=~/.local/bin sh
            ```

            ### AI Skill (Claude Code / Cursor)

            Install the Agent Runtime skill for Claude Code and Cursor:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/skill/install.sh | sh
            ```
          files: |
            release/${{ steps.version.outputs.version }}/ar-*
            release/${{ steps.version.outputs.version }}/SKILL.md
            release/${{ steps.version.outputs.version }}/install-skill.sh
          generate_release_notes: true

  deploy:
    needs: release
    if: |
      needs.release.outputs.should_release == 'true' &&
      needs.release.outputs.should_deploy == 'true' &&
      vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Download release binary
        run: |
          mkdir -p ./bin
          gh release download "${{ needs.release.outputs.tag }}" \
            --pattern "ar-linux-x64" --dir ./bin
          chmod +x ./bin/ar-linux-x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare settings
        run: |
          cat > /tmp/settings.jsonc << EOF
          {
            "project": "${{ vars.GCP_PROJECT }}",
            "region": "${{ vars.GCP_REGION }}",
            "runtimeAccount": "${{ vars.AR_RUNTIME_ACCOUNT }}",
            "workerAccount": "${{ vars.AR_WORKER_ACCOUNT }}",
            "auth": { "method": "adc" }
          }
          EOF

      - name: Initialize registry
        run: |
          ./bin/ar-linux-x64 init --no-input \
            --registry ./default-registry \
            --settings /tmp/settings.jsonc \
            --project ${{ vars.GCP_PROJECT }} \
            --region ${{ vars.GCP_REGION }} \
            --runtime-account ${{ vars.AR_RUNTIME_ACCOUNT }}
        env:
          AR_AUTH_METHOD: adc

      - name: Build and push base agent image
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          REGION="${{ vars.GCP_REGION }}"
          PROJECT="${{ vars.GCP_PROJECT }}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/ar-agents/base:${VERSION}"
          docker build -f Dockerfile.agent-base -t "$IMAGE" .
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker push "$IMAGE"

      - name: Deploy control plane to production
        run: |
          ./bin/ar-linux-x64 cp deploy --no-input \
            --registry ./default-registry \
            --settings /tmp/settings.jsonc
        env:
          AR_AUTH_METHOD: adc
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_CLIENT_ID: ${{ vars.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          INCIDENT_IO_API_KEY: ${{ secrets.INCIDENT_IO_API_KEY }}
          AR_SESSION_SECRET: ${{ secrets.AR_SESSION_SECRET }}
          AR_ADMIN_GROUP: ${{ vars.AR_ADMIN_GROUP }}
          AR_ALLOWED_DOMAINS: ${{ vars.AR_ALLOWED_DOMAINS }}
